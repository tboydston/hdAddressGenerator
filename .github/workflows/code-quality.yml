name: Code Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, so new dependency advisories surface without a push.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
      # Fails on moderate or higher advisories in the dependencies shipped to users.
      - run: npm audit --omit=dev --audit-level=moderate

  package:
    name: Package contents
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci --omit=dev
      - run: npm pack --dry-run
      # The published files must run with production dependencies only.
      - run: node examples.js
